<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edge Detection Viewer</title>
    <style>
        body { margin: 0; font-family: Arial, sans-serif; background: #000; color: #fff; }
        #viewer { position: relative; width: 100vw; height: 100vh; }
        #canvas { display: block; width: 100%; height: 100%; object-fit: contain; }
        #stats { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); padding: 10px; border-radius: 5px; }
    </style>
</head>
<body>
    <div id="viewer">
        <canvas id="canvas"></canvas>
        <div id="stats">
            <div>FPS: <span id="fps">15.2</span></div>
            <div>Resolution: <span id="resolution">640x480</span></div>
        </div>
    </div>
    <script type="module" src="./dist/viewer.js"></script>
</body>
</html>
